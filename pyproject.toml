[project]
name = "kfpga"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["amaranth[builtin-yosys]>=0.5.8"]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.15.0",
]
testing = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.pytest]
minversion = "9.0"
addopts = ["--cov=kfpga"]
testpaths = ["tests"]
